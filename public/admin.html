<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StorySong — Admin Orders</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f5f8; color: #222; }
    header { background: #111827; color: white; padding: 28px 20px; }
    header div, main { max-width: 1100px; margin: auto; }
    header h1 { margin: 0 0 6px; }
    header p { margin: 0; opacity: .8; }
    main { padding: 30px 20px; }
    .summary, .order-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    #orderCount { font-size: 32px; font-weight: bold; }
    .order-header { display: flex; justify-content: space-between; gap: 15px; align-items: center; }
    .order-number { font-size: 20px; font-weight: bold; }
    .status { padding: 7px 12px; border-radius: 20px; font-weight: bold; background: #e5e7eb; }
    .paid { background: #dcfce7; color: #166534; }
    .new { background: #fef3c7; color: #92400e; }
    .details { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 16px; }
    .detail, .story, .message { background: #f9fafb; border-radius: 8px; padding: 12px; }
    .story, .message { margin-top: 12px; }
    .message { background: #fff7ed; }
    .label { display: block; font-size: 12px; font-weight: bold; color: #6b7280; margin-bottom: 4px; text-transform: uppercase; }
    button { margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 8px; background: #111827; color: white; font-weight: bold; cursor: pointer; }
    .notice { background: white; padding: 30px; border-radius: 12px; text-align: center; }
    .orders-section { margin-top: 24px; }
    .orders-section-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .orders-section-header h2 { margin: 0; }
    .order-badge { background: #e5e7eb; border-radius: 20px; padding: 6px 12px; font-weight: bold; }
    .closed-orders summary { cursor: pointer; background: white; border-radius: 12px; padding: 18px 20px; font-size: 20px; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 18px; }
    .closed-orders[open] summary { margin-bottom: 18px; }
  </style>
</head>
<body>
<header>
  <div>
    <h1>🎵 StorySong</h1>
    <p>Admin Orders</p>
  </div>
</header>
<main>
  <div class="summary" style="margin-bottom:20px;">
    <h2>⚙️ Store Settings</h2>
    <label for="songPrice" class="label">Custom Song Price</label>
    <div style="display:flex;align-items:center;gap:8px;max-width:300px;">
      <span style="font-size:20px;font-weight:bold;">$</span>
      <input
        id="songPrice"
        type="number"
        min="0.01"
        max="1000"
        step="0.01"
        style="width:140px;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:16px;"
      >
    </div>
    <button onclick="saveStoreSettings()">Save Price</button>
    <div id="storeSettingsMessage" style="margin-top:10px;font-weight:bold;"></div>
  </div>

  <div class="summary">
    <h2>Customer Orders</h2>
    <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;">
      <div>
        <div id="orderCount">—</div>
        <div>total orders</div>
      </div>
      <div>
        <strong>Active Orders (<span id="activeOrderCount">—</span>)</strong>
      </div>
      <div>
        <strong>Closed Orders (<span id="closedOrderCount">—</span>)</strong>
      </div>
    </div>
    <button onclick="loadOrders()">Refresh Orders</button>
  </div>
  <section class="orders-section">
    <div class="orders-section-header">
      <h2>Active Orders</h2>
    </div>
    <div id="orders"><div class="notice">Loading active orders...</div></div>
  </section>

  <section class="orders-section">
    <details class="closed-orders">
      <summary>View Closed Orders</summary>
      <div id="closedOrders"><div class="notice">Loading closed orders...</div></div>
    </details>
  </section>
</main>
<script>
function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
function formatDate(value) {
  if (!value) return "";
  return new Date(value).toLocaleString();
}

async function updateStatus(button) {
const select = button.previousElementSibling;
const orderId = select.dataset.orderId;
const status = select.value;
button.disabled = true;
button.textContent = "Updating...";
try {
const response = await fetch("/api/admin/orders/" + encodeURIComponent(orderId) + "/status", {
method: "PATCH",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ status })
});
if (!response.ok) throw new Error("Could not update status.");
await loadOrders();
} catch (error) {
console.error(error);
alert("Could not update the order status.");
} finally {
button.disabled = false;
button.textContent = "Update Status";
}
}




async function sendCustomerEmail(orderId, button) {
  button.disabled = true;
  button.textContent = "Sending...";

  try {
    const response = await fetch(
      "/api/admin/orders/" + encodeURIComponent(orderId) + "/send-email",
      { method: "POST" }
    );

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.error || "Could not send delivery email.");
    }

    alert("Delivery email sent successfully.");
  } catch (error) {
    console.error(error);
    alert(error.message || "Could not send delivery email.");
  } finally {
    button.disabled = false;
    button.textContent = "📧 Send to Customer";
  }
}

async function markDelivered(orderId, button) {
button.disabled = true;
button.textContent = "Marking...";
try {
const response = await fetch("/api/admin/orders/" + encodeURIComponent(orderId) + "/status", {
method: "PATCH",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ status: "Delivered" })
});
if (!response.ok) throw new Error("Could not mark order delivered.");
await loadOrders();
} catch (error) {
console.error(error);
alert("Could not mark the order delivered.");
} finally {
button.disabled = false;
button.textContent = "✅ Mark Delivered";
}
}

function toggleLyrics(button) {
  const panel = button.nextElementSibling;
  const isHidden = panel.style.display === "none";

  panel.style.display = isHidden ? "block" : "none";
  button.textContent = isHidden ? "Hide Lyrics" : "Show Lyrics";
}

async function createSong(orderId) {
  const button = document.querySelector(`button[onclick="createSong('${orderId}')"]`);

  await fetch("/api/admin/orders/" + encodeURIComponent(orderId) + "/status", {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status: "Creating" })
  });
  if (button) {
    button.disabled = true;
    button.textContent = "Creating Lyrics...";
  }

  try {
    const ordersResponse = await fetch("/api/admin/orders");
    if (!ordersResponse.ok) throw new Error("Could not load order details.");

    const ordersData = await ordersResponse.json();
    const order = (ordersData.orders || []).find(item => item.id === orderId);

    if (!order) throw new Error("Order not found.");

    const response = await fetch("/api/song", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        person: order.person,
        occasion: order.occasion,
        story: order.story,
        music: order.style,
        mood: order.mood,
        message: order.message || "",
        vocalGender: order.vocal_gender || "Any",
        vocalStyle: order.vocal_style || "Warm and expressive",
        tempo: order.tempo || "Medium",
        duet: order.duet || "No duet",
        instruments: order.instruments || "No preference"
      })
    });

    if (!response.ok) {
      const errorData = await response.json().catch(() => ({}));
      throw new Error(errorData.error || "Could not create lyrics.");
    }

    const data = await response.json();

    if (button) button.textContent = "Saving Lyrics...";

    const saveResponse = await fetch("/api/admin/orders/" + encodeURIComponent(orderId) + "/song", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        songTitle: data.title,
        lyrics: data.song
      })
    });

    if (!saveResponse.ok) {
      const saveError = await saveResponse.json().catch(() => ({}));
      throw new Error(saveError.error || "Lyrics were created but could not be saved.");
    }
    await loadOrders();

    alert("Lyrics created and saved successfully:\\n\\n" + data.title + "\\n\\n" + data.song);
  } catch (error) {
    console.error(error);
    alert(error.message || "Could not create song.");
  } finally {
    if (button) {
      button.disabled = false;
      button.textContent = "✍️ Create Lyrics";
    }
  }
}


async function generateMusic(orderId) {
  const button = document.querySelector(`button[onclick="generateMusic('${orderId}')"]`);

  if (button) {
    button.disabled = true;
    button.textContent = "Generating Music...";
  }

  try {
    const response = await fetch("/api/admin/orders/" + encodeURIComponent(orderId) + "/music", {
      method: "POST",
      headers: { "Content-Type": "application/json" }
    });

    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(errorText || "Could not generate music.");
    }

    const data = await response.json();

    alert("Music created successfully!");

    await loadOrders();
  } catch (error) {
    console.error(error);
    alert(error.message || "Could not generate music.");
  } finally {
    if (button) {
      button.disabled = false;
      button.textContent = "🎶 Generate Music";
    }
  }
}


async function playSong(orderId) {
  const button = document.querySelector(`button[onclick="playSong('${orderId}')"]`);

  if (button) {
    button.disabled = true;
    button.textContent = "▶️ Loading Song...";
  }

  try {
    const response = await fetch("/api/admin/orders/" + encodeURIComponent(orderId) + "/music");

    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(errorText || "Could not load the song.");
    }

    const audioBlob = await response.blob();
    const audioUrl = URL.createObjectURL(audioBlob);
    const audio = new Audio(audioUrl);

    audio.addEventListener("ended", () => {
      URL.revokeObjectURL(audioUrl);
      if (button) {
        button.disabled = false;
        button.textContent = "▶️ Play Song";
      }
    });

    audio.addEventListener("error", () => {
      URL.revokeObjectURL(audioUrl);
      if (button) {
        button.disabled = false;
        button.textContent = "▶️ Play Song";
      }
      alert("Could not play the song.");
    });

    await audio.play();

    if (button) {
      button.disabled = false;
      button.textContent = "⏸️ Playing...";
    }
  } catch (error) {
    console.error(error);
    alert(error.message || "Could not play the song.");

    if (button) {
      button.disabled = false;
      button.textContent = "▶️ Play Song";
    }
  }
}

function copyDeliveryLink(deliveryToken) {
  const url = new URL("/delivery.html?token=" + encodeURIComponent(deliveryToken), window.location.origin);
  navigator.clipboard.writeText(url.href)
    .then(() => alert("Customer delivery link copied!"))
    .catch(() => alert("Could not copy the delivery link."));
}

async function loadOrders() {
  const container = document.getElementById("orders");
  const count = document.getElementById("orderCount");
  container.innerHTML = '<div class="notice">Loading orders...</div>';
  try {
    const response = await fetch("/api/admin/orders");
    if (!response.ok) throw new Error("Could not load orders.");
    const data = await response.json();
    const orders = data.orders || [];
    const activeOrders = orders.filter(order => String(order.status || "New") !== "Delivered");
    const closedOrders = orders.filter(order => String(order.status || "New") === "Delivered");
    const closedContainer = document.getElementById("closedOrders");
    const activeCount = document.getElementById("activeOrderCount");
    const closedCount = document.getElementById("closedOrderCount");

    count.textContent = orders.length;
    activeCount.textContent = activeOrders.length;
    closedCount.textContent = closedOrders.length;

    if (!orders.length) {
      container.innerHTML = '<div class="notice">No active customer orders.</div>';
      closedContainer.innerHTML = '<div class="notice">No closed orders yet.</div>';
      return;
    }

    const renderOrders = ordersToRender => ordersToRender.map(order => {
      const status = String(order.status || "New");
      const statusClass = status.toLowerCase() === "paid" ? "paid" : "new";
      return `
        <div class="order-card">
          <div class="order-header">
            <div class="order-number">${escapeHtml(order.id)}</div>
            <div class="status ${statusClass}">${escapeHtml(status)}</div>
 <select class="status-select" data-order-id="${escapeHtml(order.id)}"><option${status === "New" ? " selected" : ""}>New</option><option${status === "Paid" ? " selected" : ""}>Paid</option><option${status === "Creating" ? " selected" : ""}>Creating</option><option${status === "Ready" ? " selected" : ""}>Ready</option><option${status === "Delivered" ? " selected" : ""}>Delivered</option></select><button type="button" onclick="updateStatus(this)">Update Status</button>
          </div>
          <div class="details">
            <div class="detail"><span class="label">Customer</span>${escapeHtml(order.customer_name)}</div>
            <div class="detail"><span class="label">Email</span>${escapeHtml(order.email)}</div>
            <div class="detail"><span class="label">Song For</span>${escapeHtml(order.person)}</div>
            <div class="detail"><span class="label">Occasion</span>${escapeHtml(order.occasion)}</div>
            <div class="detail"><span class="label">Music Style</span>${escapeHtml(order.style)}</div>
            <div class="detail"><span class="label">Lead Vocal</span>${escapeHtml(order.vocal_gender || "Any")}</div>
            <div class="detail"><span class="label">Vocal Style</span>${escapeHtml(order.vocal_style || "Warm and expressive")}</div>
            <div class="detail"><span class="label">Tempo</span>${escapeHtml(order.tempo || "Medium")}</div>
            <div class="detail"><span class="label">Duet</span>${escapeHtml(order.duet || "No duet")}</div>
            <div class="detail"><span class="label">Instruments</span>${escapeHtml(order.instruments || "No preference")}</div>
            <div class="detail"><span class="label">Mood</span>${escapeHtml(order.mood)}</div>
            <div class="detail"><span class="label">Price</span>$${Number(order.price_amount || 0).toFixed(2)}</div>
            <div class="detail"><span class="label">Ordered</span>${escapeHtml(formatDate(order.created_at))}</div>
          </div>
          <div class="story"><span class="label">Their Story</span>${escapeHtml(order.story)}</div>
          ${order.message ? `<div class="message"><span class="label">Special Message</span>${escapeHtml(order.message)}</div>` : ""}
          ${order.song_title && order.lyrics ? `
            <div class="message">
              <span class="label">Generated Song</span>
              <strong>${escapeHtml(order.song_title)}</strong>
              <div style="margin-top: 10px;">
                <button type="button" onclick="toggleLyrics(this)">Show Lyrics</button>
                <div class="lyrics-panel" style="display: none; white-space: pre-wrap; margin-top: 10px;">${escapeHtml(order.lyrics)}</div>
              </div>
            </div>
          ` : ""}
          ${order.has_music ? `<button type="button" onclick="playSong('${escapeHtml(order.id)}')">▶️ Play Song</button>` : ""}
          ${(status === "Ready" || status === "Delivered") && order.has_music ? `<a href="/delivery.html?token=${encodeURIComponent(order.delivery_token)}" target="_blank"><button type="button">🔗 Customer Delivery</button></a><button type="button" onclick="copyDeliveryLink('${escapeHtml(order.delivery_token)}')">📋 Copy Link</button><button type="button" onclick="sendCustomerEmail('${escapeHtml(order.id)}', this)">📧 Send to Customer</button>${status === "Ready" ? `<button type="button" onclick="markDelivered('${escapeHtml(order.id)}', this)">✅ Mark Delivered</button>` : ""}` : ""}
          ${(status === "Paid" || status === "Creating") && !order.has_music && !(order.song_title && order.lyrics) ? `<button type="button" onclick="createSong('${escapeHtml(order.id)}')">✍️ Create Lyrics</button>` : ""}
          ${order.song_title && order.lyrics && !order.has_music ? `<button type="button" onclick="generateMusic('${escapeHtml(order.id)}')">🎶 Generate Music</button>` : ""}
        </div>`;
    }).join("");

    container.innerHTML = activeOrders.length
      ? renderOrders(activeOrders)
      : '<div class="notice">No active customer orders.</div>';

    closedContainer.innerHTML = closedOrders.length
      ? renderOrders(closedOrders)
      : '<div class="notice">No closed orders yet.</div>';
  } catch (error) {
    console.error(error);
    count.textContent = "—";
    document.getElementById("activeOrderCount").textContent = "—";
    document.getElementById("closedOrderCount").textContent = "—";
    container.innerHTML = '<div class="notice">Could not load customer orders.</div>';
    document.getElementById("closedOrders").innerHTML = '<div class="notice">Could not load closed orders.</div>';
  }
}

async function loadStoreSettings() {
  const priceInput = document.getElementById("songPrice");
  const message = document.getElementById("storeSettingsMessage");

  try {
    const response = await fetch("/api/admin/store-settings");
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Could not load store settings.");
    }

    priceInput.value = data.songPrice || "20.00";
    message.textContent = "";
  } catch (error) {
    console.error(error);
    message.textContent = "Could not load store settings.";
  }
}

async function saveStoreSettings() {
  const priceInput = document.getElementById("songPrice");
  const message = document.getElementById("storeSettingsMessage");

  message.textContent = "Saving...";

  try {
    const response = await fetch("/api/admin/store-settings", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ songPrice: priceInput.value })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Could not save store settings.");
    }

    priceInput.value = data.songPrice;
    message.textContent = `Price saved: $${data.songPrice}`;
  } catch (error) {
    console.error(error);
    message.textContent = error.message || "Could not save store settings.";
  }
}

loadStoreSettings();
loadOrders();

</script>
</body>
</html>
