
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LyriBop Advertising Dashboard</title>
  <link rel="stylesheet" href="style.css">

  <script src="dashboard.js" defer></script>
<script src="captions.js" defer></script>
<script src="videos.js" defer></script>
<script src="all-ads.js" defer></script>
<script src="history.js" defer></script>
</head>
<body>

<div class="dashboard">
  <aside class="sidebar">
    <h1>💜 LyriBop</h1>
    <p>Turn Moments Into Songs</p>

    <nav>
      <a href="#" class="active" onclick="showReadyToPost(); return false;">Ready to Post</a>
      <a href="#" onclick="showAllAds(); return false;">All Ads</a>
      <a href="#" onclick="loadAdvertisements(); return false;">Static Ads</a>
      <a href="#" onclick="showLyriBopVideos(); return false;">Video Ads</a>
      <a href="#">Captions</a>
      <a href="#">Hashtags</a>
      <a href="#">Archive</a>
      <a href="#" onclick="showPostingHistory(); return false;">Posting History</a>
    </nav>
<script>
document.querySelectorAll(".sidebar a").forEach(link => {
  link.addEventListener("click", () => {
    document.querySelectorAll(".sidebar a").forEach(item => item.classList.remove("active"));
    link.classList.add("active");
  });
});
</script>

  </aside>

  <main class="main">
    <header class="dashboard-header">    <h1>LyriBop Advertising Dashboard</h1>
    <p>All your approved ads, captions, and hashtags in one place.</p>
    </header>
    <div class="dashboard-content">
    <div class="panel">
      <h2 id="section-title">Ready to Post</h2>
      <div id="ad-selector"></div><div id="ad-preview"></div>
    </div>
  
<section class="caption-section">
  <div class="caption-grid">
    <div class="panel caption-card">
      <div class="caption-header">
        <h3>Facebook Caption</h3>
        <button id="copy-facebook" type="button">Copy All</button>
      </div>
      <div id="facebook-caption" class="caption-text"></div>
    </div>

    <div class="panel caption-card">
      <div class="caption-header">
        <h3>Instagram Caption</h3>
        <button id="copy-instagram" type="button">Copy All</button>
      </div>
      <div id="instagram-caption" class="caption-text"></div>
    </div>
  </div>

  <div class="panel hashtag-card">
    <div class="caption-header">
      <h3>Key Hashtags (Copy Only)</h3>
      <button id="copy-hashtags" type="button">Copy Hashtags</button>
    </div>
    <div id="ad-hashtags" class="caption-text"></div>
  </div>
</section>
    </div>

</main>
</div>

<script src="posting.js" defer></script>
</body>
</html>
